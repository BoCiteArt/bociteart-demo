<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bo'CitéArt</title>

<style>
body{font-family:Arial;margin:0;background:#f5f5f5}
header{background:#111;color:#fff;padding:10px;text-align:center}
.tab{display:none;padding:15px}
.tab.active{display:block}

button{
  padding:10px;
  border-radius:8px;
  border:1px solid #ccc;
  cursor:pointer;
  font-weight:700;
}

textarea,input{
  width:100%;
  padding:8px;
  margin-top:5px;
  border-radius:8px;
  border:1px solid #ccc;
}

.box{
  background:#fff;
  padding:12px;
  border-radius:10px;
  border:1px solid #ddd;
  margin-top:10px;
}

#topTicker{
  margin-top:10px;
  background:#fff;
  padding:10px;
  border-radius:10px;
}
</style>
</head>

<body>

<header>
  <h2>Bo'CitéArt</h2>

  <div id="topTicker">
    <div id="tickerTitleA" style="font-weight:900;">Annonce partenaire</div>
    <div id="tickerSubA">Aucune publicité active</div>
  </div>
</header>

<div style="display:flex;gap:10px;padding:10px;">
  <button onclick="openTab('home')">Accueil</button>
  <button onclick="openTab('mairie')">Mairie</button>
</div>

<div id="home" class="tab active">
  <h3>Accueil</h3>
</div>

<div id="mairie" class="tab">
  <h3>Mairie</h3>

  <div class="box">
    <button id="openCalendarBtn">Choisir date</button>

    <div style="margin-top:10px;">
      <input id="dateField" placeholder="AAAA-MM-JJ">
    </div>

    <div style="margin-top:10px;">
      <input id="titleField" placeholder="Titre pub">
    </div>

    <div style="margin-top:10px;">
      <textarea id="textField" placeholder="Texte pub"></textarea>
    </div>

    <div style="margin-top:10px;">
      <button id="activateBtn">ACTIVER PUB</button>
    </div>
  </div>

  <div id="calendar" class="box" style="display:none;"></div>
</div>

<script>

function openTab(id){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

/* =========================
   CALENDRIER SIMPLE
========================= */

const calendarDiv = document.getElementById("calendar");

document.getElementById("openCalendarBtn").onclick = ()=>{
  renderCalendar();
  calendarDiv.style.display = "block";
};

function renderCalendar(){

  let html = "<b>Choisir une date</b><br><br>";

  for(let i=1;i<=30;i++){
    html += `<button onclick="selectDate(${i})">${i}</button> `;
  }

  calendarDiv.innerHTML = html;
}

function selectDate(day){

  const date = "2026-04-" + String(day).padStart(2,"0");

  document.getElementById("dateField").value = date;

  calendarDiv.style.display = "none";

}

/* =========================
   PUBLICATION PUB
========================= */

document.getElementById("activateBtn").onclick = ()=>{

  const title = document.getElementById("titleField").value;
  const text  = document.getElementById("textField").value;

  if(!title && !text){
    alert("Remplis au moins un champ");
    return;
  }

  const fullText = title + " - " + text;

  localStorage.setItem("mairie_pub", fullText);

  updateTicker();

  alert("PUB ACTIVE ✔");

};

/* =========================
   TICKER
========================= */

function updateTicker(){

  const data = localStorage.getItem("mairie_pub");

  if(!data) return;

  document.getElementById("tickerTitleA").innerText = "Mairie";
  document.getElementById("tickerSubA").innerText = data;

}

updateTicker();

</script>

</body>
</html>
