<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bo'CitéArt</title>

<style>
body{font-family:Arial;margin:0;background:#f5f5f5}
header{background:#111;color:#fff;padding:10px;text-align:center}
.tab{display:none;padding:15px}
.tab.active{display:block}

button{
padding:10px;
border-radius:8px;
border:1px solid #ccc;
background:#fff;
font-weight:bold;
cursor:pointer;
}

textarea,input{
width:100%;
margin-top:5px;
padding:8px;
border-radius:8px;
border:1px solid #ccc;
}

.box{
background:#fff;
padding:10px;
border-radius:10px;
margin-top:10px;
border:1px solid #ddd;
}

#topTicker{
background:#fff;
padding:10px;
border-radius:10px;
margin-top:10px;
}

.calGrid{
display:grid;
grid-template-columns:repeat(7,1fr);
gap:5px;
}

.calDay{
padding:8px;
background:#eee;
text-align:center;
border-radius:6px;
cursor:pointer;
}

.calDay.full{background:#ffb3b3}
</style>
</head>

<body>

<header>
<h2>Bo'CitéArt</h2>

<div id="topTicker">
<div id="tickerTitle">Annonce partenaire</div>
<div id="tickerText">Aucune pub active</div>
</div>
</header>

<div style="padding:10px;">
<button onclick="openTab('mairie')">Mairie</button>
</div>

<div id="mairie" class="tab active">

<h3>Mairie</h3>

<div class="box">
<b>Calendrier réservation</b>

<div id="calendar"></div>

</div>

<div class="box">
<b>Date sélectionnée</b>
<input id="dateInput" readonly>
</div>

<div class="box">
<b>Titre</b>
<input id="titleInput">
</div>

<div class="box">
<b>Texte</b>
<textarea id="textInput"></textarea>
</div>

<div style="margin-top:10px;">
<button onclick="saveAd()">Valider le devis</button>
<button onclick="payAd()">Marquer payé</button>
<button onclick="activateAd()">Activer</button>
</div>

<div class="box">
<b>Aperçu</b>
<div id="preview"></div>
</div>

</div>

<script>

function openTab(id){
document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
document.getElementById(id).classList.add('active');
}

// CALENDRIER SIMPLE
function buildCalendar(){
let html="";
let today=new Date();

for(let d=1;d<=31;d++){
html+=`<div class="calDay" onclick="selectDate(${d})">${d}</div>`;
}

document.getElementById("calendar").innerHTML=html;
}

function selectDate(d){
let date=`2026-04-${String(d).padStart(2,'0')}`;
document.getElementById("dateInput").value=date;
}

// PUB
let currentAd={};

function saveAd(){
currentAd={
date:dateInput.value,
title:titleInput.value,
text:textInput.value,
paid:false
};

preview.innerText="Devis validé : "+currentAd.title;
}

function payAd(){
if(!currentAd.title){
alert("Valide d'abord le devis");
return;
}
currentAd.paid=true;
preview.innerText="Payé ✔";
}

function activateAd(){
if(!currentAd.paid){
alert("Paiement requis");
return;
}

tickerTitle.innerText=currentAd.title;
tickerText.innerText=currentAd.text;

preview.innerText="Diffusé ✔";
}

// INIT
buildCalendar();

</script>

</body>
</html>
