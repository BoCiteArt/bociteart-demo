<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bo'CitéArt - Test pub</title>

<style>
body{font-family:Arial;margin:0;background:#f5f5f5}
header{background:#111;color:#fff;padding:10px;text-align:center}
button{padding:10px;border-radius:8px;border:1px solid #ccc;background:#fff;font-weight:bold;cursor:pointer}
textarea,input{width:100%;margin-top:5px;padding:8px;border-radius:8px;border:1px solid #ccc;box-sizing:border-box}
.box{background:#fff;padding:10px;border-radius:10px;margin:10px;border:1px solid #ddd}
#topTicker{background:#fff;color:#111;padding:10px;border-radius:10px;margin-top:10px;text-align:left}
.calGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px}
.calDay{padding:8px;background:#eee;text-align:center;border-radius:6px;cursor:pointer}
.calDay:hover{background:#ddd}
</style>
</head>

<body>

<header>
  <h2>Bo'CitéArt</h2>
  <div id="topTicker">
    <div id="tickerTitle" style="font-weight:900;">Annonce partenaire</div>
    <div id="tickerText">Aucune pub active</div>
  </div>
</header>

<div class="box">
  <h3>Mairie</h3>

  <b>Calendrier réservation</b>
  <div id="calendar" class="calGrid"></div>

  <b>Date sélectionnée</b>
  <input id="dateInput" readonly>

  <b>Titre</b>
  <input id="titleInput" placeholder="Ex : Grand cirque ce soir">

  <b>Texte</b>
  <textarea id="textInput" placeholder="Ex : 25 places à 5 € au lieu de 10 €"></textarea>

  <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;">
    <button onclick="saveAd()">Valider le devis</button>
    <button onclick="payAd()">Marquer payé</button>
    <button onclick="activateAd()">Activer dans le bandeau</button>
    <button onclick="resetAll()">Réinitialiser</button>
  </div>

  <div class="box">
    <b>Aperçu</b>
    <div id="preview">Aucune publicité préparée.</div>
  </div>
</div>

<script>
let currentAd = null;

function buildCalendar(){
  let html = "";
  for(let d = 1; d <= 31; d++){
    html += `<div class="calDay" onclick="selectDate(${d})">${d}</div>`;
  }
  document.getElementById("calendar").innerHTML = html;
}

function selectDate(d){
  const date = `2026-04-${String(d).padStart(2,"0")}`;
  document.getElementById("dateInput").value = date;
  document.getElementById("titleInput").focus();
}

function saveAd(){
  const date = document.getElementById("dateInput").value.trim();
  const title = document.getElementById("titleInput").value.trim();
  const text = document.getElementById("textInput").value.trim();

  if(!date){
    alert("Choisis d’abord une date.");
    return;
  }

  if(!title || !text){
    alert("Renseigne le titre et le texte.");
    return;
  }

  currentAd = {
    date,
    title,
    text,
    paid:false
  };

  document.getElementById("preview").innerText =
    "Devis validé : " + title + " • " + text;
}

function payAd(){
  if(!currentAd){
    alert("Valide d’abord le devis.");
    return;
  }

  currentAd.paid = true;
  document.getElementById("preview").innerText =
    "Payé ✔ : " + currentAd.title + " • " + currentAd.text;
}

function activateAd(){
  if(!currentAd){
    alert("Valide d’abord le devis.");
    return;
  }

  if(!currentAd.paid){
    alert("Marque d’abord la publicité comme payée.");
    return;
  }

  document.getElementById("tickerTitle").innerText = currentAd.title;
  document.getElementById("tickerText").innerText = currentAd.text;

  localStorage.setItem("bociteart_active_pub", JSON.stringify(currentAd));

  document.getElementById("preview").innerText = "Diffusé ✔ dans le grand bandeau.";
}

function restoreActiveAd(){
  try{
    const raw = localStorage.getItem("bociteart_active_pub");
    if(!raw) return;

    const pub = JSON.parse(raw);

    if(pub && pub.title && pub.text){
      document.getElementById("tickerTitle").innerText = pub.title;
      document.getElementById("tickerText").innerText = pub.text;
    }
  }catch(e){}
}

function resetAll(){
  localStorage.removeItem("bociteart_active_pub");
  currentAd = null;

  document.getElementById("dateInput").value = "";
  document.getElementById("titleInput").value = "";
  document.getElementById("textInput").value = "";
  document.getElementById("tickerTitle").innerText = "Annonce partenaire";
  document.getElementById("tickerText").innerText = "Aucune pub active";
  document.getElementById("preview").innerText = "Aucune publicité préparée.";
}

buildCalendar();
restoreActiveAd();
</script>

</body>
</html>
