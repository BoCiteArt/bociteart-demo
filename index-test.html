<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bo'CitéArt - TEST PROPRE</title>

<style>
body{font-family:Arial;margin:0;background:#f5f5f5}
header{background:#111;color:#fff;padding:10px;text-align:center}
button{padding:10px;border-radius:8px;border:1px solid #ccc;background:#fff;font-weight:bold;cursor:pointer}
textarea,input{width:100%;margin-top:5px;padding:8px;border-radius:8px;border:1px solid #ccc;box-sizing:border-box}
.box{background:#fff;padding:10px;border-radius:10px;margin:10px;border:1px solid #ddd}
#topTicker{background:#fff;color:#111;padding:10px;border-radius:10px;margin-top:10px}
.calGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px}
.calDay{padding:8px;background:#eee;text-align:center;border-radius:6px;cursor:pointer}
.calDay.full{background:#ffb3b3}
</style>
</head>

<body>

<header>
<h2>Bo'CitéArt</h2>

<div id="topTicker">
<div id="tickerTitle" style="font-weight:900;">Annonce partenaire</div>
<div id="tickerText">Aucune pub active</div>
</div>
</header>

<div class="box">

<h3>Mairie / Association (réservation pub)</h3>

<!-- CALENDRIER -->
<b>Calendrier (max 10 pubs / jour)</b>
<div id="calendar" class="calGrid"></div>

<!-- DATE -->
<b>Date sélectionnée</b>
<input id="dateInput" readonly>

<!-- TITRE -->
<b>Titre</b>
<input id="titleInput">

<!-- TEXTE -->
<b>Texte</b>
<textarea id="textInput"></textarea>

<!-- ACTIONS -->
<div style="margin-top:10px;">
<button onclick="saveAd()">Valider le devis</button>
<button onclick="payAd()">Marquer payé</button>
<button onclick="activateAd()">Activer</button>
<button onclick="resetAll()">Reset</button>
</div>

<!-- APERÇU -->
<div class="box">
<b>Aperçu</b>
<div id="preview">Aucune pub</div>
</div>

</div>

<script>

// ==================== CONFIG ====================
const MAX_PER_DAY = 10;

// ==================== STORAGE ====================
function loadBookings(){
  return JSON.parse(localStorage.getItem("bookings") || "{}");
}

function saveBookings(b){
  localStorage.setItem("bookings", JSON.stringify(b));
}

// ==================== CALENDRIER ====================
function buildCalendar(){
  let html="";
  const bookings = loadBookings();

  for(let d=1; d<=31; d++){
    let date = `2026-04-${String(d).padStart(2,"0")}`;
    let count = bookings[date] ? bookings[date].length : 0;

    let cls = count>=MAX_PER_DAY ? "calDay full" : "calDay";

    html += `<div class="${cls}" onclick="selectDate('${date}')">
              ${d}<br>${count}/${MAX_PER_DAY}
            </div>`;
  }

  document.getElementById("calendar").innerHTML = html;
}

function selectDate(date){
  let bookings = loadBookings();
  let list = bookings[date] || [];

  if(list.length >= MAX_PER_DAY){
    alert("Jour complet");
    return;
  }

  document.getElementById("dateInput").value = date;

  // NE SORT PAS DE L'ONGLET
  document.getElementById("titleInput").focus();
}

// ==================== PUB ====================
let currentAd = null;

function saveAd(){
  let date = dateInput.value;
  let title = titleInput.value;
  let text = textInput.value;

  if(!date){
    alert("Choisir une date");
    return;
  }

  if(!title || !text){
    alert("Remplir titre + texte");
    return;
  }

  currentAd = {
    date,
    title,
    text,
    paid:false
  };

  preview.innerText = "Devis validé ✔";
}

function payAd(){
  if(!currentAd){
    alert("Valider le devis");
    return;
  }

  currentAd.paid = true;
  preview.innerText = "Payé ✔";
}

function activateAd(){

  if(!currentAd || !currentAd.paid){
    alert("Paiement requis");
    return;
  }

  let bookings = loadBookings();

  if(!bookings[currentAd.date]){
    bookings[currentAd.date] = [];
  }

  bookings[currentAd.date].push({
    title: currentAd.title,
    text: currentAd.text
  });

  saveBookings(bookings);

  // AFFICHAGE BANDEAU
  document.getElementById("tickerTitle").innerText = currentAd.title;
  document.getElementById("tickerText").innerText = currentAd.text;

  localStorage.setItem("activePub", JSON.stringify(currentAd));

  preview.innerText = "Diffusé ✔";

  buildCalendar();
}

// ==================== RESTORE ====================
function restore(){
  let pub = JSON.parse(localStorage.getItem("activePub") || "null");

  if(pub){
    tickerTitle.innerText = pub.title;
    tickerText.innerText = pub.text;
  }
}

// ==================== RESET ====================
function resetAll(){
  localStorage.clear();
  location.reload();
}

// ==================== INIT ====================
buildCalendar();
restore();

</script>

</body>
</html>
